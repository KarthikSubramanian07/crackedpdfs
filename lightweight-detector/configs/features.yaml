dataset_config: configs/dataset.yaml
output_features_path: data/processed/features.parquet
output_labels_path: data/processed/labels.parquet
output_canonical_metadata_path: data/processed/canonical_metadata.parquet
feature_schema_version: feature-schema-v3
extractor:
  page_box: cropbox
  text_entropy_bins: 10
  coord_clip_min: -1.0
  coord_clip_max: 2.0
  white_color_threshold: 0.99
  small_font_threshold: 3.0
  hidden_font_threshold: 2.0
  bbox_char_width_factor: 0.5
  include_text_mismatch: false
