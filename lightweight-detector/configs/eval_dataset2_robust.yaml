dataset_config: configs/dataset_dataset2_robust.yaml
features_path: data/processed/dataset2_robust/features.parquet
labels_path: data/processed/dataset2_robust/labels.parquet
splits_path: data/processed/dataset2_robust/splits.json
artifacts_dir: data/artifacts/dataset2_robust
model_artifacts:
  - name: logreg
    path: data/artifacts/dataset2_robust/models/logreg.pkl
    training_config: configs/model_logreg_dataset2_robust.yaml
  - name: xgb
    path: data/artifacts/dataset2_robust/models/xgb.pkl
    training_config: configs/model_xgb_dataset2_robust.yaml
regime_columns:
  - spatial_regime
  - rendering_regime
  - structural_regime
  - message_type
  - attack_family
  - benign_confounder_family
  - source_type
baselines:
  - name: rule
    enabled: true
    threshold: 0.5
  - name: promptguard
    enabled: true
    threshold: 0.5
    model_name: meta-llama/Prompt-Guard-86M
    max_length: 512
run_ablations: true
run_sanity_checks: true
ablations:
  include_group_ablations: true
  custom_specs:
    - name: font_only
      drop_feature_groups:
        - spatial
        - rendering
        - structural
        - mismatch
        - distribution
    - name: spatial_only
      drop_feature_groups:
        - font
        - rendering
        - structural
        - mismatch
        - distribution
    - name: rendering_only
      drop_feature_groups:
        - spatial
        - font
        - structural
        - mismatch
        - distribution
    - name: structural_only
      drop_feature_groups:
        - spatial
        - font
        - rendering
        - mismatch
        - distribution
    - name: no_stream_shortcuts
      drop_feature_columns:
        - num_content_streams_total
        - mean_streams_per_page
        - std_streams_per_page
        - num_stream_objects
        - avg_stream_length_bytes
        - max_stream_length_bytes
    - name: no_offpage_shortcuts
      drop_feature_columns:
        - num_text_outside_page_bounds
        - frac_text_outside_page
        - num_text_negative_coords
        - max_abs_x
        - max_abs_y
        - max_distance_from_page_center
        - mean_distance_from_page_center
        - distance_outlier_score
    - name: no_cluster_shortcut
      drop_feature_columns:
        - injection_cluster_score
    - name: no_render_shortcuts
      drop_feature_columns:
        - num_render_mode_3
        - frac_render_mode_3
        - num_white_text
        - frac_white_text
        - white_text_on_white_bg_flag
    - name: no_known_shortcuts
      drop_feature_columns:
        - num_text_outside_page_bounds
        - frac_text_outside_page
        - num_text_negative_coords
        - max_abs_x
        - max_abs_y
        - max_distance_from_page_center
        - mean_distance_from_page_center
        - distance_outlier_score
        - num_render_mode_3
        - frac_render_mode_3
        - num_white_text
        - frac_white_text
        - white_text_on_white_bg_flag
        - num_content_streams_total
        - mean_streams_per_page
        - std_streams_per_page
        - num_stream_objects
        - avg_stream_length_bytes
        - max_stream_length_bytes
        - artifact_bmc_count
        - artifact_emc_count
        - has_artifact_wrapper
        - injection_cluster_score
        - text_density_per_page
    - name: no_known_shortcuts_plus_proxies
      drop_feature_columns:
        - page_width
        - page_height
        - num_text_objects
        - num_text_outside_page_bounds
        - frac_text_outside_page
        - num_text_negative_coords
        - max_abs_x
        - max_abs_y
        - max_distance_from_page_center
        - mean_distance_from_page_center
        - coord_entropy_x
        - coord_entropy_y
        - bbox_area_mean
        - bbox_area_std
        - quadrant_density_q1
        - quadrant_density_q2
        - quadrant_density_q3
        - quadrant_density_q4
        - coord_variance_x
        - coord_variance_y
        - distance_outlier_score
        - num_render_mode_3
        - frac_render_mode_3
        - num_nonstandard_render_modes
        - num_white_text
        - frac_white_text
        - white_text_on_white_bg_flag
        - num_pages
        - num_content_streams_total
        - mean_streams_per_page
        - std_streams_per_page
        - artifact_bmc_count
        - artifact_emc_count
        - has_artifact_wrapper
        - num_text_show_ops
        - num_stream_objects
        - avg_stream_length_bytes
        - max_stream_length_bytes
        - text_density_per_page
        - injection_cluster_score
plots:
  dpi: 160
