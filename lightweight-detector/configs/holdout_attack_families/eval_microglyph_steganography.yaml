dataset_config: configs/holdout_attack_families/dataset_microglyph_steganography.yaml
features_path: data/processed/hard_provenance/features.parquet
labels_path: data/processed/hard_provenance/labels.parquet
splits_path: data/processed/holdout_attack_family/microglyph_steganography/splits.json
artifacts_dir: data/artifacts/holdout_attack_family/microglyph_steganography
model_artifacts:
- name: logreg
  path: data/artifacts/holdout_attack_family/microglyph_steganography/models/logreg.pkl
  training_config: configs/holdout_attack_families/model_logreg_microglyph_steganography.yaml
- name: xgb
  path: data/artifacts/holdout_attack_family/microglyph_steganography/models/xgb.pkl
  training_config: configs/holdout_attack_families/model_xgb_microglyph_steganography.yaml
- name: logreg_shortcut_free
  path: data/artifacts/holdout_attack_family/microglyph_steganography/models/logreg_shortcut_free.pkl
  training_config: configs/holdout_attack_families/model_logreg_shortcut_free_microglyph_steganography.yaml
- name: xgb_shortcut_free
  path: data/artifacts/holdout_attack_family/microglyph_steganography/models/xgb_shortcut_free.pkl
  training_config: configs/holdout_attack_families/model_xgb_shortcut_free_microglyph_steganography.yaml
- name: text_tfidf
  path: data/artifacts/holdout_attack_family/microglyph_steganography/models/text_tfidf.pkl
  training_config: configs/holdout_attack_families/model_text_tfidf_microglyph_steganography.yaml
regime_columns:
- spatial_regime
- rendering_regime
- structural_regime
- message_type
- attack_family
- benign_confounder_family
- source_type
baselines:
- name: rule
  enabled: true
  threshold: 0.5
- name: promptguard
  enabled: true
  reuse_scores: true
  allow_legacy_cache: false
  write_scores: true
  threshold: 0.5
  model_name: meta-llama/Prompt-Guard-86M
  max_length: 512
  batch_size: 32
run_ablations: true
run_sanity_checks: true
leakage_gate:
  single_feature_accuracy_threshold: 0.7
  fail_on_shortcut_risk: true
bootstrap:
  iterations: 200
  random_state: 42
claim_thresholds:
  primary_shortcut_free_models:
  - logreg_shortcut_free
  - xgb_shortcut_free
  - text_tfidf
  min_shortcut_free_f1: 0.75
  min_paired_benign_confounder_accuracy: 0.75
  max_full_to_shortcut_free_f1_drop: 0.2
  text_detector:
    max_wrapper_top_weight_hits: 0
    max_wrapper_strip_f1_drop: 0.05
  fail_on_blocked: false
exact_commands:
- python -m src.cli validate-dataset --config configs/dataset_hard_provenance.yaml
- python -m src.cli build-features --config configs/features_hard_provenance.yaml
- python -m src.cli build-splits --config configs/dataset_hard_provenance.yaml
- python -m src.cli train --model logreg --config configs/model_logreg_hard_provenance.yaml
- python -m src.cli train --model xgb --config configs/model_xgb_hard_provenance.yaml
- python -m src.cli train --model logreg --config configs/model_logreg_hard_provenance_shortcut_free.yaml
- python -m src.cli train --model xgb --config configs/model_xgb_hard_provenance_shortcut_free.yaml
- python -m src.cli train --model text --config configs/model_text_tfidf_hard_provenance.yaml
- python -m src.cli evaluate --config configs/eval_hard_provenance.yaml
ablations:
  include_group_ablations: true
  custom_specs:
  - name: drop_shortcut:all_known_plus_proxies
    drop_feature_columns:
    - page_width
    - page_height
    - num_text_objects
    - num_text_outside_page_bounds
    - frac_text_outside_page
    - num_text_negative_coords
    - max_abs_x
    - max_abs_y
    - max_distance_from_page_center
    - mean_distance_from_page_center
    - coord_entropy_x
    - coord_entropy_y
    - bbox_area_mean
    - bbox_area_std
    - quadrant_density_q1
    - quadrant_density_q2
    - quadrant_density_q3
    - quadrant_density_q4
    - coord_variance_x
    - coord_variance_y
    - distance_outlier_score
    - num_render_mode_3
    - frac_render_mode_3
    - num_nonstandard_render_modes
    - num_white_text
    - frac_white_text
    - white_text_on_white_bg_flag
    - num_pages
    - num_content_streams_total
    - mean_streams_per_page
    - std_streams_per_page
    - artifact_bmc_count
    - artifact_emc_count
    - has_artifact_wrapper
    - num_text_show_ops
    - num_stream_objects
    - avg_stream_length_bytes
    - max_stream_length_bytes
    - text_density_per_page
    - injection_cluster_score
plots:
  dpi: 160
