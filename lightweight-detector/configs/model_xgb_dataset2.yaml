model_name: xgb
features_config: configs/features_dataset2.yaml
features_path: data/processed/dataset2/features.parquet
labels_path: data/processed/dataset2/labels.parquet
splits_path: data/processed/dataset2/splits.json
output_model_path: data/artifacts/dataset2/models/xgb.pkl
output_metrics_path: data/artifacts/dataset2/metrics/xgb_train_metrics.json
random_state: 42
threshold: 0.5
xgb:
  n_estimators: 400
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 1.0
  min_child_weight: 1.0
  early_stopping_rounds: 25
  eval_metric: logloss
