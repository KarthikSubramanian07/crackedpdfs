model_name: xgb
features_config: configs/features_hard_provenance.yaml
features_path: data/processed/hard_provenance/features.parquet
labels_path: data/processed/hard_provenance/labels.parquet
splits_path: data/processed/hard_provenance/splits.json
output_model_path: data/artifacts/hard_provenance_fast/models/xgb_shortcut_free.pkl
output_metrics_path: data/artifacts/hard_provenance_fast/metrics/xgb_shortcut_free_train_metrics.json
random_state: 42
threshold: 0.5
threshold_selection: best_f1_on_val
drop_feature_columns:
  - page_width
  - page_height
  - num_text_objects
  - num_text_outside_page_bounds
  - frac_text_outside_page
  - num_text_negative_coords
  - max_abs_x
  - max_abs_y
  - max_distance_from_page_center
  - mean_distance_from_page_center
  - coord_entropy_x
  - coord_entropy_y
  - bbox_area_mean
  - bbox_area_std
  - quadrant_density_q1
  - quadrant_density_q2
  - quadrant_density_q3
  - quadrant_density_q4
  - coord_variance_x
  - coord_variance_y
  - distance_outlier_score
  - num_render_mode_3
  - frac_render_mode_3
  - num_nonstandard_render_modes
  - num_white_text
  - frac_white_text
  - white_text_on_white_bg_flag
  - num_pages
  - num_content_streams_total
  - mean_streams_per_page
  - std_streams_per_page
  - artifact_bmc_count
  - artifact_emc_count
  - has_artifact_wrapper
  - num_text_show_ops
  - num_stream_objects
  - avg_stream_length_bytes
  - max_stream_length_bytes
  - text_density_per_page
  - injection_cluster_score
xgb:
  n_estimators: 80
  max_depth: 3
  learning_rate: 0.08
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 1.0
  min_child_weight: 1.0
  early_stopping_rounds: 10
  eval_metric: logloss
