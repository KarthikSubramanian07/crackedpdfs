dataset_config: configs/dataset.yaml
features_path: data/processed/features.parquet
labels_path: data/processed/labels.parquet
splits_path: data/processed/splits.json
artifacts_dir: data/artifacts
model_artifacts:
  - name: logreg
    path: data/artifacts/models/logreg.pkl
    training_config: configs/model_logreg.yaml
  - name: xgb
    path: data/artifacts/models/xgb.pkl
    training_config: configs/model_xgb.yaml
  - name: logreg_shortcut_free
    path: data/artifacts/models/logreg_shortcut_free.pkl
    training_config: configs/model_logreg_shortcut_free.yaml
  - name: xgb_shortcut_free
    path: data/artifacts/models/xgb_shortcut_free.pkl
    training_config: configs/model_xgb_shortcut_free.yaml
regime_columns:
  - spatial_regime
  - rendering_regime
  - structural_regime
  - message_type
  - attack_family
  - benign_confounder_family
  - source_type
baselines:
  - name: rule
    enabled: true
    threshold: 0.5
  - name: promptguard
    enabled: true
    threshold: 0.5
    model_name: meta-llama/Prompt-Guard-86M
    max_length: 512
    batch_size: 32
run_ablations: true
run_sanity_checks: true
ablations:
  include_group_ablations: true
  custom_specs:
    - name: "drop_shortcut:outside_geometry"
      drop_feature_columns:
        - num_text_outside_page_bounds
        - frac_text_outside_page
        - num_text_negative_coords
        - max_abs_x
        - max_abs_y
        - max_distance_from_page_center
        - mean_distance_from_page_center
        - distance_outlier_score
    - name: "drop_shortcut:cluster"
      drop_feature_columns:
        - injection_cluster_score
    - name: "drop_shortcut:stream_counts"
      drop_feature_columns:
        - num_content_streams_total
        - mean_streams_per_page
        - std_streams_per_page
        - num_stream_objects
        - avg_stream_length_bytes
        - max_stream_length_bytes
    - name: "drop_shortcut:all_known"
      drop_feature_columns:
        - num_text_outside_page_bounds
        - frac_text_outside_page
        - num_text_negative_coords
        - max_abs_x
        - max_abs_y
        - max_distance_from_page_center
        - mean_distance_from_page_center
        - distance_outlier_score
        - injection_cluster_score
        - num_content_streams_total
        - mean_streams_per_page
        - std_streams_per_page
        - num_stream_objects
        - avg_stream_length_bytes
        - max_stream_length_bytes
    - name: "drop_shortcut:all_known_plus_proxies"
      drop_feature_columns:
        - page_width
        - page_height
        - num_text_objects
        - num_text_outside_page_bounds
        - frac_text_outside_page
        - num_text_negative_coords
        - max_abs_x
        - max_abs_y
        - max_distance_from_page_center
        - mean_distance_from_page_center
        - coord_entropy_x
        - coord_entropy_y
        - bbox_area_mean
        - bbox_area_std
        - quadrant_density_q1
        - quadrant_density_q2
        - quadrant_density_q3
        - quadrant_density_q4
        - coord_variance_x
        - coord_variance_y
        - distance_outlier_score
        - num_render_mode_3
        - frac_render_mode_3
        - num_nonstandard_render_modes
        - num_white_text
        - frac_white_text
        - white_text_on_white_bg_flag
        - num_pages
        - num_content_streams_total
        - mean_streams_per_page
        - std_streams_per_page
        - artifact_bmc_count
        - artifact_emc_count
        - has_artifact_wrapper
        - num_text_show_ops
        - num_stream_objects
        - avg_stream_length_bytes
        - max_stream_length_bytes
        - text_density_per_page
        - injection_cluster_score
plots:
  dpi: 160
