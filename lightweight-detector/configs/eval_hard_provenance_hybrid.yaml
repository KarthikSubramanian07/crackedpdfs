dataset_config: configs/dataset_hard_provenance.yaml
features_path: data/processed/hard_provenance/features.parquet
labels_path: data/processed/hard_provenance/labels.parquet
splits_path: data/processed/hard_provenance/splits.json
artifacts_dir: data/artifacts/hard_provenance_hybrid
model_artifacts:
  - name: hybrid
    path: data/artifacts/hard_provenance/models/hybrid.pkl
    training_config: configs/model_hybrid_hard_provenance.yaml
regime_columns:
  - spatial_regime
  - rendering_regime
  - structural_regime
  - message_type
  - attack_family
  - benign_confounder_family
  - source_type
baselines:
  - name: rule
    enabled: true
    threshold: 0.5
  - name: promptguard
    enabled: true
    reuse_scores: true
    allow_legacy_cache: false
    write_scores: true
    threshold: 0.5
    scores_path: data/artifacts/hard_provenance_publication/metrics/promptguard_scores.csv
    model_name: meta-llama/Prompt-Guard-86M
    score_strategy: sum_injection_and_jailbreak
    max_length: 512
    batch_size: 32
run_ablations: false
run_sanity_checks: false
leakage_gate:
  single_feature_accuracy_threshold: 0.70
  fail_on_shortcut_risk: true
bootstrap:
  iterations: 0
  random_state: 42
claim_thresholds:
  primary_shortcut_free_models:
    - hybrid
  min_shortcut_free_f1: 0.75
  min_paired_benign_confounder_accuracy: 0.75
  min_paired_benign_confounder_support: 30
  min_paired_benign_confounder_ci95_low: 0.60
  max_full_to_shortcut_free_f1_drop: 0.2
  fail_on_blocked: false
exact_commands:
  - python -m src.cli train --model hybrid --config configs/model_hybrid_hard_provenance.yaml
  - python -m src.cli evaluate --config configs/eval_hard_provenance_hybrid.yaml
plots:
  dpi: 160
