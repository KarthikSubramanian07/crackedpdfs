[package]
name = "noise_stuffy_layer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noise_stuffy_layer"
path = "src/main.rs"

[lib]
name = "noise_stuffy_layer"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
once_cell = "1.19"
pdf-writer = "0.10"
pdfium-render = "0.8"
reqwest = { version = "0.12", features = ["blocking"] }
tch = "0.16"
dirs = "5.0"
moxcms = "0.7"
pxfm = "0.1"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1

 
